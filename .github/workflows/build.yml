name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Building reads the repo and nothing more. Only the release job below can write, and it runs
# none of the project's code or dependencies. Actions are pinned to commits, not to tags that can move.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 espeak-ng libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libdbus-1-3
      - name: Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --version=6.7.1 -y --no-progress
      - name: Build
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.10" -c packaging/constraints.txt
          python packaging/build.py --installer
      - name: Smoke test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          app=dist/TTSPython/TTSPython
          [ "$RUNNER_OS" = "Windows" ] && app="$app.exe"
          export TTSPYTHON_SETTINGS="$RUNNER_TEMP/smoke-settings.json" TTSPYTHON_INSTANCE=ttspython-ci-smoke
          "$app" --version
          "$app" --mini &
          pid=$!
          sleep 20
          "$app" --quit
          wait $pid
          test -f "$TTSPYTHON_SETTINGS"  # the full app started and saved on quit
      - name: Self-test
        # Loads every part started on first use (Whisper, the voice model's libraries, the live preview).
        # Does not stop the release yet: it has not run on these machines, which have no audio device.
        continue-on-error: true
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          app=dist/TTSPython/TTSPython
          [ "$RUNNER_OS" = "Windows" ] && app="$app.exe"
          TTSPYTHON_SELFTEST="$RUNNER_TEMP/selftest.json" TTSPYTHON_SETTINGS="$RUNNER_TEMP/selftest-settings.json" \
            TTSPYTHON_DATA="$RUNNER_TEMP/selftest-data" "$app"
          cat "$RUNNER_TEMP/selftest.json"
          python -c "import json, os, sys; sys.exit(bool(json.load(open(os.environ['RUNNER_TEMP'] + '/selftest.json'))['problems']))"
      - name: Installer test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/*-setup.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP "installed app"
          $flags = "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`""
          $p = Start-Process $setup -ArgumentList $flags -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exit $($p.ExitCode)" }
          $p = Start-Process "$dir/TTSPython.exe" -ArgumentList "--version" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "app exit $($p.ExitCode)" }
          $p = Start-Process "$dir/unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall exit $($p.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path "$dir/TTSPython.exe") -and (Get-Date) -lt $deadline) { Start-Sleep 1 }
          if (Test-Path "$dir/TTSPython.exe") { throw "uninstall left the app behind" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: TTSPython-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          fail_on_unmatched_files: true
          files: release/*
