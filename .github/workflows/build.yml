name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Building reads the repo and nothing more. Only the release job below can write, and it runs
# none of the project's code or dependencies. Actions are pinned to commits, not to tags that can move.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            optional: false
          # Does not stop a release yet: the suite has not been run on Linux.
          - os: ubuntu-22.04
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 espeak-ng libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libdbus-1-3
      - name: Tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          lock=packaging/requirements-linux.lock
          [ "$RUNNER_OS" = "Windows" ] && lock=packaging/requirements-windows.lock
          python -m pip install --require-hashes --no-deps -r "$lock"
          python -m pip install pytest==9.2.0 pytest-qt==4.5.0 psutil==7.2.2
          python -m pytest -q

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 espeak-ng libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libdbus-1-3
      - name: Inno Setup
        # The exact one the installer was tested with, checked by hash. Nothing to install: it just runs.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "innosetup.zip"
          $dir = Join-Path $env:RUNNER_TEMP "innosetup"
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Tools.InnoSetup/6.7.3" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne "F780898E402FF80612CC8D9FCB8C6E02932BD1CB4C900FFDAA31F9341CFB49F4") { throw "Inno Setup hash $hash" }
          Expand-Archive $zip $dir
          "ISCC=$dir\tools\ISCC.exe" >> $env:GITHUB_ENV
      - name: Build
        shell: bash
        run: |
          lock=packaging/requirements-linux.lock
          [ "$RUNNER_OS" = "Windows" ] && lock=packaging/requirements-windows.lock
          python -m pip install --require-hashes --no-deps -r "$lock"
          python packaging/build.py --installer
      - name: Smoke test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          app=dist/TTSPython/TTSPython
          [ "$RUNNER_OS" = "Windows" ] && app="$app.exe"
          export TTSPYTHON_SETTINGS="$RUNNER_TEMP/smoke-settings.json" TTSPYTHON_INSTANCE=ttspython-ci-smoke
          "$app" --version
          "$app" --mini &
          pid=$!
          sleep 20
          "$app" --quit
          wait $pid
          test -f "$TTSPYTHON_SETTINGS"  # the full app started and saved on quit
      - name: Self-test
        # Loads every part started on first use (Whisper, the voice model's libraries, the live preview).
        # A problem here stops the release. These machines have no audio device, and may have no voices:
        # those say nothing about the build, but a part that does not load does.
        timeout-minutes: 5
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          TTSPYTHON_SELFTEST_NO_VOICES_OK: "1"
        run: |
          app=dist/TTSPython/TTSPython
          [ "$RUNNER_OS" = "Windows" ] && app="$app.exe"
          TTSPYTHON_SELFTEST="$RUNNER_TEMP/selftest.json" TTSPYTHON_SETTINGS="$RUNNER_TEMP/selftest-settings.json" \
            TTSPYTHON_DATA="$RUNNER_TEMP/selftest-data" "$app"
          cat "$RUNNER_TEMP/selftest.json"
          python -c "import json, os, sys; sys.exit(bool(json.load(open(os.environ['RUNNER_TEMP'] + '/selftest.json'))['problems']))"
      - name: Installer test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/*-setup.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP "installed app"
          $flags = "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`""
          $p = Start-Process $setup -ArgumentList $flags -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exit $($p.ExitCode)" }
          $p = Start-Process "$dir/TTSPython.exe" -ArgumentList "--version" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "app exit $($p.ExitCode)" }
          $p = Start-Process "$dir/unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall exit $($p.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path "$dir/TTSPython.exe") -and (Get-Date) -lt $deadline) { Start-Sleep 1 }
          if (Test-Path "$dir/TTSPython.exe") { throw "uninstall left the app behind" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: TTSPython-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.tar.gz

  release:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          fail_on_unmatched_files: true
          files: release/*
