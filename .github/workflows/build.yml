name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 espeak-ng libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libdbus-1-3
      - name: Build
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.10" -c packaging/constraints.txt
          python packaging/build.py
      - name: Smoke test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          app=dist/TTSPython/TTSPython
          [ "$RUNNER_OS" = "Windows" ] && app="$app.exe"
          export TTSPYTHON_SETTINGS="$RUNNER_TEMP/smoke-settings.json" TTSPYTHON_INSTANCE=ttspython-ci-smoke
          "$app" --version
          "$app" --mini &
          pid=$!
          sleep 20
          "$app" --quit
          wait $pid
          test -f "$TTSPYTHON_SETTINGS"  # the full app started and saved on quit
      - uses: actions/upload-artifact@v4
        with:
          name: TTSPython-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
