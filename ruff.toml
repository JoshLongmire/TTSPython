# target: the oldest Python this runs on. A try in a loop (PERF203) costs nothing from 3.11 on, and where it is used
# here each item may fail on its own, so that rule is not used.
target-version = "py310"
line-length = 130

[lint]
select = ["E4", "E7", "E9", "F", "I", "SIM105", "S110", "RUF046"]

[lint.per-file-ignores]
"tests/*" = ["SIM105", "S110", "RUF046", "I"]
"tools/*" = ["SIM105", "S110", "RUF046", "I"]
"packaging/*" = ["SIM105", "S110", "RUF046", "I"]
"TTSPython.py" = ["I"]
