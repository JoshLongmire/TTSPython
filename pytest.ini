[pytest]
testpaths = tests
qt_api = pyside6
addopts = -m "not audio and not desktop and not legacy" -p no:cacheprovider
markers =
    audio: uses real speech engines and audio devices
    desktop: checks real windows on the desktop (focus; no input is sent)
    legacy: runs the bug specs against v4.1.0 from git (expected to fail there)
